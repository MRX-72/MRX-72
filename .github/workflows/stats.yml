name: stats
on:
  schedule:
    - cron: "0 3 * * *"     # daily, 03:00 UTC
  workflow_dispatch:
  push:
    paths: [scripts/gen_stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/gen_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats card"
          git push
