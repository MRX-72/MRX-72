<svg width="500" height="195" viewBox="0 0 500 195" xmlns="http://www.w3.org/2000/svg">
<style>
  .t { font: 600 18px 'Segoe UI',Ubuntu,sans-serif; fill: url(#heading) }
  .k { font: 600 14px 'Segoe UI',Ubuntu,sans-serif; fill: #1f2328 }
  .v { font: 700 14px 'Segoe UI',Ubuntu,sans-serif; fill: #0969da }
  .r { font: 800 26px 'Segoe UI',Ubuntu,sans-serif; fill: #1f2328; text-anchor: middle }
  .track { stroke: #0969da; stroke-width: 6; fill: none; opacity: 0.25 }
  .prog { stroke: url(#arc); stroke-width: 6; fill: none; stroke-linecap: round;
           stroke-dasharray: 219.9 251.3;
           transform: rotate(-90deg); transform-origin: 405px 100px }
</style>
<defs>
  <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f6f8fa"/><stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0969da"/><stop offset="100%" stop-color="#8250df"/>
  </linearGradient>
  <linearGradient id="heading" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0969da"/><stop offset="100%" stop-color="#8250df"/>
  </linearGradient>
</defs>
<rect width="499" height="194" x="0.5" y="0.5" rx="6" fill="url(#ground)" stroke="#d1d9e0"/>
<text x="25" y="35" class="t">MRX-72's GitHub Stats</text>
<g transform="translate(25,70)"><g transform="translate(0,0)"><text x="0" y="0" class="k">Total Commits:</text><text x="250" y="0" class="v">149</text></g><g transform="translate(0,26)"><text x="0" y="0" class="k">Commits in 2026:</text><text x="250" y="0" class="v">77</text></g><g transform="translate(0,52)"><text x="0" y="0" class="k">Lines Added:</text><text x="250" y="0" class="v">53.9k</text></g><g transform="translate(0,78)"><text x="0" y="0" class="k">Public Repos:</text><text x="250" y="0" class="v">19</text></g><g transform="translate(0,104)"><text x="0" y="0" class="k">Followers:</text><text x="250" y="0" class="v">13</text></g></g>
<circle cx="405" cy="100" r="40" class="track"/>
<circle cx="405" cy="100" r="40" class="prog">
  <animate attributeName="stroke-dasharray" from="0 251.3"
           to="219.9 251.3" dur="1s"
           calcMode="spline" keySplines="0.2 0 0.2 1" fill="freeze"/>
</circle>
<text x="405" y="110" class="r">A+</text>
</svg>